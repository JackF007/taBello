# Zero-cost distribution: no paid certificates.
# - macOS: ad-hoc signed ("-"); users confirm the first launch in System Settings → Privacy & Security.
# - Windows: unsigned; SmartScreen shows "More info → Run anyway" until the app builds reputation.
# - Linux: AppImage (runs on any distribution without installation) and .deb.
# The app icon is build/icon.png, rendered from build/icon.svg.
appId: org.tabello.app
productName: TaBello
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  # alphaTab's build plugin also copies its own soundfont; TaBello plays with GeneralUser GS instead.
  - "!out/renderer/assets/soundfont/**"
  - package.json
extraResources:
  # Shipped next to the app so users can read them (GPL-3.0 and third-party obligations).
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # Sample recordings (public-domain pieces, see shared/samples.ts).
  - from: resources/samples
    to: samples
asarUnpack:
  # Executables and native files must live outside app.asar.
  - "**/node_modules/ffmpeg-static/**"
  - "**/*.node"
  # ONNX Runtime starts worker threads from its loader, which Node cannot do inside app.asar.
  - "out/main/transcription-assets/ort/**"
mac:
  category: public.app-category.music
  identity: "-"
  hardenedRuntime: false
  target: dmg
  artifactName: TaBello-${version}-mac-${arch}.${ext}
dmg:
  # The usual window: drag TaBello onto Applications.
  title: TaBello
win:
  target: nsis
  artifactName: TaBello-Setup-${version}.${ext}
nsis:
  # One click: no questions and no administrator rights (installs for the current user), then
  # TaBello opens. Shortcuts on the desktop and in the Start menu; uninstall from Settings → Apps.
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: TaBello
  runAfterFinish: true
  # Projects and the separation model stay when TaBello is uninstalled or updated.
  deleteAppDataOnUninstall: false
linux:
  category: Audio
  # AppImage runs on any distribution; the .deb installs with a double click on Ubuntu, Debian, Mint.
  target: [AppImage, deb]
  artifactName: TaBello-${version}-linux-${arch}.${ext}
  executableName: tabello
  syncDesktopName: true
  synopsis: Turn recordings into guitar, bass and ukulele tabs
  maintainer: JackF007 <45083625+JackF007@users.noreply.github.com>
publish:
  provider: github
  releaseType: draft
