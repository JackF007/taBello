appId: org.tabello.app
productName: TaBello
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
asarUnpack:
  # Native binaries (e.g. ffmpeg-static) must live outside app.asar to be executable.
  - "**/*.node"
  - "**/node_modules/ffmpeg-static/**"
mac:
  category: public.app-category.music
  target: dmg
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Audio
  target:
    - AppImage
    - deb
publish: null
