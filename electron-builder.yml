# Zero-cost distribution: no paid certificates.
# - macOS: ad-hoc signed ("-"); users confirm the first launch in System Settings → Privacy & Security.
# - Windows: unsigned; SmartScreen shows "More info → Run anyway" until the app builds reputation.
# - Linux: AppImage, runs on any distribution without installation.
appId: org.tabello.app
productName: TaBello
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
asarUnpack:
  # Executables and native files must live outside app.asar.
  - "**/node_modules/ffmpeg-static/**"
  - "**/*.node"
mac:
  category: public.app-category.music
  identity: "-"
  hardenedRuntime: false
  target: dmg
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Audio
  target: AppImage
publish:
  provider: github
  releaseType: draft
